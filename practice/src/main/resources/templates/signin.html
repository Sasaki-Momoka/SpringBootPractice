<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>サインイン</title>
</head>

<body>
	<h2>ログイン画面</h2>
	<form th:action="@{/admin/signin}" th:object="${adminSigninForm}" method="post">
		
    <text align="center">
		<div>
			<label>メールアドレス:</label>
			<input type="text" th:field="*{email}" />
			<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></div>
		</div>
		<div>
			<label>パスワード:</label>
			<input type="password" th:field="*{password}" />
			<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></div>
		</div>
		<div>
			<button type="submit">ログイン</button>
		</div>
    </text>
	</form>
</body>

</html>
