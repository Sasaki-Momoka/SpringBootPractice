<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>サインアップ</title>
<input type="hidden" name="id" th:field="*{id}">
</head>
<body>
	<h2>新規ユーザー登録</h2>
	<form th:action="@{/admin/signup}" th:object="{adminForm}" method="post">
	
	  <div>
            <label>姓:</label>
            <input type="text" th:field="*{last_name}" />
            <div th:if="${#fields.hasErrors('last_name')}" th:errors="*{last_name}" style="color:red;"></div>
        </div>
	
	
	  <div>
            <label>名:</label>
            <input type="text" th:field="*{first_name}" />
            <div th:if="${#fields.hasErrors('first_name')}" th:errors="*{first_name}" style="color:red;"></div>
        </div>
	
	
	
        <div>
            <label>メールアドレス:</label>
            <input type="text" th:field="*{email}" />
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></div>
        </div>
	
		<div>
			<label>パスワード:　　</label>
			<input type="password" th:field="*{password}" />
			<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></div>
		</div>
	
		<div>
			<button type="submit">登録</button>
        </div>
    </form>
</body>
</html>
		
		
		
		
	</form>

</body>
</html>
