<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>サインアップ</title>
</head>
<body>
	<h1>新規ユーザー登録</h1>
	<form th:action="@{/admin/signup}" th:object="{signupForm}" method="post">
	
		<div>
			<label>メールアドレス:</label>
			<imput type="text" th:field="*{email}" />
			<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></div>
		</div>
	
		<div>
			<label>パスワード:</label>
			<input type="password" th:field="*{password}" />
			<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></div>
		</div>
	
		<div>
			<button type="submit">登録</button>
        </div>
    </form>
</body>
</html>
